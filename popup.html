<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 340px;
      margin: 0;
      padding: 12px;
      background: #14161a;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .brand img {
      width: 20px;
      height: 20px;
      border-radius: 4px;
    }
    h3 { margin: 0; color: #facc15; font-size: 14px; }
    .quota { font-size: 11px; color: #94a3b8; }
    .quota.warn { color: #f59e0b; font-weight: 600; }
    .panel {
      background: #1e2229;
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .sites {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }
    .sites label, .qu-toggle label {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      color: #cbd5e1;
    }
    select {
      background: #0f1115;
      color: #f1f5f9;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 3px 6px;
      font-size: 11px;
    }
    .tests-list {
      max-height: 190px;
      overflow-y: auto;
      border: 1px solid #272c36;
      border-radius: 6px;
      background: #0f1115;
      margin-bottom: 8px;
    }
    .test-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      border-bottom: 1px solid #1e2229;
    }
    .test-item:last-child { border-bottom: none; }
    .test-label {
      display: flex;
      align-items: center;
      gap: 6px;
      flex: 1;
      min-width: 0;
      cursor: pointer;
    }
    .test-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 11px;
    }
    .test-meta { font-size: 10px; color: #64748b; }
    .btn-del-one {
      background: transparent;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-size: 13px;
      padding: 0 4px;
      line-height: 1;
    }
    .actions { display: flex; gap: 6px; }
    .btn {
      flex: 1;
      padding: 8px 0;
      border: none;
      border-radius: 5px;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-export { background: #facc15; color: #14161a; }
    .btn-clear { background: #334155; color: #f87171; flex: 0 0 96px; }
    .empty { padding: 16px; text-align: center; color: #64748b; }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <img src="icons/icon32.png" alt="ngramIntl">
      <h3>ngramIntl Sync</h3>
    </div>
    <span id="quota-label" class="quota">0 tests · 0 Ko</span>
  </div>

  <div class="panel">
    <div class="row qu-toggle">
      <span>Tokenisation <strong>Qu</strong> :</span>
      <div style="display:flex;gap:10px;">
        <label><input type="radio" name="quMode" value="0"> qu = 2</label>
        <label><input type="radio" name="quMode" value="1"> qu = 1</label>
      </div>
    </div>
    <div class="sites">
      <label><input type="checkbox" data-site="monkeytype"> Monkeytype</label>
      <label><input type="checkbox" data-site="typeracer"> TypeRacer</label>
      <label><input type="checkbox" data-site="fastfingers10"> 10FastFingers</label>
    </div>
  </div>

  <div class="panel row">
    <span>Langue export : <select id="lang-filter"><option value="ALL">Toutes</option></select></span>
    <label style="cursor:pointer;color:#94a3b8;"><input type="checkbox" id="select-all" checked> Tout cocher</label>
  </div>

  <div id="tests-list" class="tests-list"></div>

  <div class="actions">
    <button id="btn-export" class="btn btn-export">Exporter JSON</button>
    <button id="btn-clear" class="btn btn-clear">Tout vider</button>
  </div>

  <script src="core/storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
